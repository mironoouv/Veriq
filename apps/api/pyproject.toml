[project]
name = "veriq-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.135,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.mypy]
strict = true

[tool.ruff]
src = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
