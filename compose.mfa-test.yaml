# Extend compose.login-test.yaml on the isolated TLS test host only.
services:
  migrate:
    environment:
      VERIQ_TEST_MFA_DB_PASSWORD: ${VERIQ_TEST_MFA_DB_PASSWORD:?Set a dedicated MFA verifier password}
  api:
    environment:
      VERIQ_ENABLE_TEST_MFA: "1"
      VERIQ_TEST_MFA_DB_PASSWORD: ${VERIQ_TEST_MFA_DB_PASSWORD:?Set a dedicated MFA verifier password}
      VERIQ_TEST_MFA_KEYRING: /run/veriq/mfa-keyring.json
    volumes:
      - type: bind
        source: ${VERIQ_TEST_MFA_KEYRING:?Set the path to the private MFA keyring}
        target: /run/veriq/mfa-keyring.json
        read_only: true
