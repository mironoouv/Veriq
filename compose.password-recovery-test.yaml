# Extend compose.login-test.yaml and optionally compose.mfa-test.yaml.
services:
  api:
    environment:
      VERIQ_ENABLE_TEST_PASSWORD_RECOVERY: "1"
      VERIQ_TEST_MAIL_KEY: ${VERIQ_TEST_MAIL_KEY:?Set a dedicated test mail encryption key}
      VERIQ_TEST_PASSWORD_BLOCKLIST: /run/veriq/recovery-blocklist.sha256
    volumes:
      - type: bind
        source: ${VERIQ_TEST_PASSWORD_BLOCKLIST:?Set the path to the test password blocklist}
        target: /run/veriq/recovery-blocklist.sha256
        read_only: true
  worker:
    environment:
      VERIQ_ENV: test
      VERIQ_ENABLE_TEST_PASSWORD_RECOVERY: "1"
      VERIQ_TEST_MAIL_KEY: ${VERIQ_TEST_MAIL_KEY:?Set a dedicated test mail encryption key}
      VERIQ_TEST_MAILBOX: /run/veriq/mailbox
    tmpfs:
      - /run/veriq/mailbox:uid=10001,gid=10001,mode=0700
