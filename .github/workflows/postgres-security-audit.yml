name: PostgreSQL security audit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  postgres-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: veriq-pg-audit
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure disposable database
        run: |
          for variable in VERIQ_DB_PASSWORD VERIQ_API_DB_PASSWORD VERIQ_WORKER_DB_PASSWORD; do
            password="$(openssl rand -hex 32)"
            echo "::add-mask::$password"
            echo "$variable=$password" >> "$GITHUB_ENV"
          done
      - name: Start PostgreSQL 17.11 and provision runtime logins
        run: |
          docker compose up -d --wait postgres
          docker compose build migrate
          docker compose run --rm -T migrate
          docker compose exec -T postgres createdb -U veriq_dev audit_upgrade
      - name: Upgrade preserved catalog fixtures
        run: |
          scratch() {
            docker compose run --no-deps --rm -T -e VERIQ_DB_NAME=audit_upgrade migrate "$@"
          }
          scratch alembic upgrade 0015
          scratch python - seed < tests/academic_catalog_checks.py
          scratch alembic upgrade head
          scratch python - < tests/academic_catalog_checks.py
      - name: Preserve populated catalog and audit from 0017 to 0018
        run: |
          docker compose exec -T postgres createdb -U veriq_dev audit_catalog_upgrade
          fixtures="$(mktemp -d)"
          cp tests/{catalog_audit_upgrade,academic_catalog_checks}.py "$fixtures/"
          git show f01b8c991cb3461f2201000770ee870e958a7209:apps/api/veriq/academic_catalog.py > "$fixtures/legacy.py"
          chmod 755 "$fixtures"
          scratch() {
            docker compose run --no-deps --rm -T -e VERIQ_DB_NAME=audit_catalog_upgrade \
              -v "$fixtures:/fixtures:ro" migrate "$@"
          }
          snapshot() {
            docker compose exec -T postgres psql -XAt -v ON_ERROR_STOP=1 -U veriq_dev -d audit_catalog_upgrade <<'SQL'
          SELECT to_jsonb(t) FROM courses t ORDER BY organization_id,id;
          SELECT to_jsonb(t) FROM study_groups t ORDER BY organization_id,id;
          SELECT to_jsonb(t) FROM academic_catalog_events t ORDER BY id;
          SQL
          }
          scratch alembic upgrade 0017
          scratch python -c 'import runpy,sys; sys.path.insert(0,"/fixtures"); sys.modules["veriq.academic_catalog"] = __import__("legacy"); runpy.run_module("catalog_audit_upgrade",run_name="__main__")' seed
          snapshot > "$fixtures/before.jsonl"
          test "$(wc -l < "$fixtures/before.jsonl")" -eq 20
          scratch alembic upgrade 0018
          snapshot > "$fixtures/after.jsonl"
          cmp "$fixtures/before.jsonl" "$fixtures/after.jsonl"
          echo "0017 -> 0018: all 4 catalog rows and 16 historical audit rows identical"
          scratch python -c 'import runpy,sys; sys.path.insert(0,"/fixtures"); runpy.run_module("catalog_audit_upgrade",run_name="__main__")'
          snapshot > "$fixtures/final.jsonl"
          test "$(wc -l < "$fixtures/final.jsonl")" -eq 40
      - name: Preserve queued jobs from 0019 to 0020
        run: |
          docker compose exec -T postgres createdb -U veriq_dev audit_queue_upgrade
          scratch() {
            docker compose run --no-deps --rm -T -e VERIQ_DB_NAME=audit_queue_upgrade migrate "$@"
          }
          database() {
            docker compose exec -T postgres psql -XAt -v ON_ERROR_STOP=1 -U veriq_dev -d audit_queue_upgrade "$@"
          }
          scratch alembic upgrade 0019
          database -c "INSERT INTO background_jobs(id,kind,status,attempts) VALUES (gen_random_uuid(),'probe','pending',1),(gen_random_uuid(),'probe','succeeded',2)"
          before="$(database -c 'SELECT id,kind,status,attempts,available_at FROM background_jobs ORDER BY id')"
          scratch alembic upgrade 0020
          after="$(database -c 'SELECT id,kind,status,attempts,available_at FROM background_jobs ORDER BY id')"
          test "$before" = "$after"
          test "$(database -c 'SELECT count(*) FROM background_jobs WHERE lease_owner IS NULL AND lease_until IS NULL')" = 2
          scratch alembic upgrade 0021
          test "$before" = "$(database -c 'SELECT id,kind,status,attempts,available_at FROM background_jobs ORDER BY id')"
          test "$(database -c 'SELECT count(*) FROM background_job_keys')" = 2
          test "$(database -c "SELECT count(*) FROM background_jobs WHERE status='succeeded' AND finished_at IS NOT NULL")" = 1
      - name: Measure populated 0021 migration and lock contention
        run: |
          docker compose exec -T postgres createdb -U veriq_dev audit_queue_large
          scratch() {
            docker compose run --no-deps --rm -T -e VERIQ_DB_NAME=audit_queue_large migrate "$@"
          }
          database() {
            docker compose exec -T postgres psql -XAt -v ON_ERROR_STOP=1 -U veriq_dev -d audit_queue_large "$@"
          }
          scratch alembic upgrade 0020
          database -c "INSERT INTO background_jobs(id,kind,status,attempts)
            SELECT gen_random_uuid(),'probe',CASE WHEN n%5=0 THEN 'pending' ELSE 'succeeded' END,1
            FROM generate_series(1,500000) n"
          snapshot() {
            database -c "SELECT count(*),sum(hashtextextended(row(id,kind,status,attempts,available_at)::text,0)) FROM background_jobs"
          }
          before="$(snapshot)"
          database -c "BEGIN; LOCK TABLE background_jobs IN ROW EXCLUSIVE MODE; SELECT pg_sleep(18); COMMIT" >/dev/null &
          blocker=$!
          for attempt in {1..50}; do
            if [ "$(database -c "SELECT count(*) FROM pg_locks WHERE relation='background_jobs'::regclass AND mode='RowExclusiveLock' AND granted")" = 1 ]; then
              break
            fi
            sleep 0.1
          done
          test "$(database -c "SELECT count(*) FROM pg_locks WHERE relation='background_jobs'::regclass AND mode='RowExclusiveLock' AND granted")" = 1
          if scratch alembic upgrade 0021 > "$RUNNER_TEMP/queue-lock.log" 2>&1; then
            echo "Migration unexpectedly succeeded with a held queue lock"
            exit 1
          fi
          grep -q 'lock timeout' "$RUNNER_TEMP/queue-lock.log"
          wait "$blocker"
          test "$(database -c 'SELECT version_num FROM alembic_version')" = 0020
          test "$(snapshot)" = "$before"
          echo "Lock contention: 0021 refused without changing revision or queue data"
          start="$(date +%s%3N)"
          scratch alembic upgrade 0021
          echo "0021 upgrade wall time including Compose startup: $(($(date +%s%3N)-start)) ms for 500000 jobs"
          test "$(snapshot)" = "$before"
          test "$(database -c 'SELECT count(*) FROM background_job_keys')" = 500000
          test "$(database -c 'SELECT count(*) FROM background_jobs WHERE finished_at IS NOT NULL')" = 400000
          echo "Preserved all 500000 queue records and keys; stamped 400000 terminal records"
      - name: Compare effective ACLs and exercise restricted logins
        run: |
          docker compose run --no-deps --rm -T migrate python - veriq audit_upgrade < tests/postgres_security_audit.py
      - name: Verify worker process crash recovery and fencing
        run: |
          docker compose run --no-deps --rm -T migrate python - < tests/worker_lease_process.py
      - name: Test queue history retention
        run: |
          docker compose exec -T postgres createdb -U veriq_dev audit_history
          scratch() {
            docker compose run --no-deps --rm -T -e VERIQ_DB_NAME=audit_history migrate "$@"
          }
          scratch alembic upgrade 0021
          scratch python - < tests/worker_history_cleanup.py
      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes
