name: Trusted MFA IPC
on: [push, pull_request]
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker build --target base -t veriq-mfa-python apps/api
      - run: docker build -t veriq-mfa-trusted -f services/mfa-trusted/Dockerfile .
      - run: |
          docker run --rm --network none --user 0 --entrypoint /app/.venv/bin/python \
            -v "$PWD/services/mfa-trusted/process_test.py:/app/process_test.py:ro" \
            veriq-mfa-trusted /app/process_test.py
      - name: PostgreSQL-backed IPC
        env:
          COMPOSE_PROJECT_NAME: veriq-trusted-ipc-ci
        run: |
          for variable in VERIQ_DB_PASSWORD VERIQ_API_DB_PASSWORD VERIQ_WORKER_DB_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            export "$variable=$value"
          done
          trap 'docker compose down --volumes' EXIT
          docker compose up -d --wait postgres
          docker compose run --build --rm -T migrate
          docker run --rm --network veriq-trusted-ipc-ci_database --user 0 \
            -e VERIQ_DB_PASSWORD -e VERIQ_TRUSTED_DB_HOST=postgres -e VERIQ_TRUSTED_DB_NAME=veriq \
            --entrypoint /app/.venv/bin/python \
            -v "$PWD/services/mfa-trusted/process_test.py:/app/process_test.py:ro" \
            veriq-mfa-trusted /app/process_test.py
