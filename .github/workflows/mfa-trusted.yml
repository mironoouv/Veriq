name: Trusted MFA IPC
on: [push, pull_request]
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: docker build --target base -t veriq-mfa-python apps/api
      - run: docker build -t veriq-mfa-trusted -f services/mfa-trusted/Dockerfile .
      - run: |
          docker run --rm --network none --user 0 --entrypoint /app/.venv/bin/python \
            -v "$PWD/services/mfa-trusted/process_test.py:/app/process_test.py:ro" \
            veriq-mfa-trusted /app/process_test.py
