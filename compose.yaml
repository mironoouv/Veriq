name: veriq

x-api: &api
  build: ./apps/api
  environment: &database-env
    VERIQ_DB_USER: veriq_dev
    VERIQ_DB_NAME: veriq
    VERIQ_DB_HOST: postgres
    VERIQ_DB_PASSWORD: ${VERIQ_DB_PASSWORD:?Generate a local password in .env}
  networks: [database]

services:
  redis:
    image: redis:8.2.11-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [queue]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: veriq
      POSTGRES_USER: veriq_dev
      POSTGRES_PASSWORD: ${VERIQ_DB_PASSWORD:?Generate a local password in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "veriq_dev", "-d", "veriq"]
      interval: 3s
      timeout: 2s
      retries: 20

  migrate:
    <<: *api
    environment:
      <<: *database-env
      VERIQ_API_DB_PASSWORD: ${VERIQ_API_DB_PASSWORD:?Generate a separate API database password}
      VERIQ_WORKER_DB_PASSWORD: ${VERIQ_WORKER_DB_PASSWORD:?Generate a separate worker database password}
    command: ["python", "-m", "veriq.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    environment: &runtime-env
      VERIQ_DB_NAME: veriq
      VERIQ_DB_HOST: postgres
      VERIQ_DB_USER: veriq_api
      VERIQ_DB_PASSWORD: ${VERIQ_API_DB_PASSWORD:?Generate a separate API database password}
      VERIQ_REDIS_URL: ${VERIQ_REDIS_URL:-redis://redis:6379/0}
    networks: [database, queue, app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 10

  worker:
    <<: *api
    environment:
      <<: *runtime-env
      VERIQ_DB_USER: veriq_worker
      VERIQ_DB_PASSWORD: ${VERIQ_WORKER_DB_PASSWORD:?Generate a separate worker database password}
    command: ["python", "-m", "veriq.worker", "run"]
    stop_grace_period: 30s
    networks: [database, queue]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "veriq.worker", "health"]
      interval: 3s
      timeout: 2s
      retries: 10

networks:
  database:
    internal: true
  queue:
    internal: true
  app:

volumes:
  postgres-data:
